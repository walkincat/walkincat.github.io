<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>WalkinCat OG 模板</title>
<!-- @font-face rules are injected by scripts/og.ts -->
<style id="og-fonts"></style>
<style>
  :root {
    --wc-ink: #343334;
    --wc-paper: #f8f8f8;
    --wc-lav-500: #9a92c9;
    --wc-lav-300: #b5b9e0;
    --wc-lav-100: #ecebf6;
    --wc-lav-700: #5a5296;
    --wc-ink-muted: #5f5d60;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--wc-paper); }
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--wc-ink); }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 440px; }
  .og__main { display: flex; flex-direction: column; padding: 56px 56px 48px 64px; min-width: 0; }
  .og__brand { display: flex; align-items: center; gap: 14px; }
  .og__mark { width: 72px; height: 72px; overflow: hidden; border-radius: 18px; background: #fff; }
  .og__mark img { width: 138px; max-width: none; margin: -15px 0 0 -33px; display: block; }
  .og__word { font-family: "Nunito", "Noto Sans TC", system-ui, sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.01em; }
  .og__word span { color: var(--wc-lav-500); }
  .og__title { margin: auto 0; font-weight: 700; font-size: 56px; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .og__title.is-long { font-size: 46px; }
  .og__foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .og__tag { font-size: 28px; font-weight: 700; color: var(--wc-lav-700); }
  .og__nia { font-size: 20px; font-weight: 500; color: var(--wc-ink-muted); border: 2px solid var(--wc-ink-muted); border-radius: 10px; padding: 2px 12px; }
  .og__side { position: relative; overflow: hidden; background: var(--wc-ink); }
  .og__side img.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .og__side svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .og__bar { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--wc-lav-500); z-index: 1; }
  /* 2026-11-09: break at punctuation first (no 加｜密), fall back to anywhere for long chunks */
  .og__title { word-break: keep-all; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="og">
  <div class="og__main">
    <div class="og__brand">
      <div class="og__mark"><img src="../public/avatar.jpg" alt=""></div>
      <div class="og__word">Walkin<span>Cat</span></div>
    </div>
    <h1 class="og__title" id="og-title"></h1>
    <div class="og__foot">
      <span class="og__tag">白話加密新手教學</span>
      <span class="og__nia">非投資建議</span>
    </div>
  </div>
  <div class="og__side" id="og-side">
    <div class="og__bar"></div>
    <svg id="og-brand" viewBox="0 0 440 630" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="440" height="630" fill="#343334"/>
      <circle cx="420" cy="60" r="150" fill="#4a4949"/>
      <circle cx="40" cy="600" r="170" fill="#4a4949"/>
      <circle cx="330" cy="470" r="46" fill="#9a92c9"/>
      <circle cx="96" cy="150" r="22" fill="#b5b9e0"/>
      <path d="M104 420 L112 196 L178 250 Q220 234 262 250 L328 196 L336 420 Q336 448 308 448 L132 448 Q104 448 104 420 Z" fill="#f8f8f8" stroke="#b5b9e0" stroke-width="10" stroke-linejoin="round"/>
      <rect x="140" y="300" width="160" height="58" rx="29" fill="#b5b9e0"/>
      <path d="M168 330 h34 M238 330 h34" stroke="#343334" stroke-width="10" stroke-linecap="round"/>
    </svg>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const og = Object.assign({
    title: "跟著走路貓，慢慢走進加密世界",
    cover: ""
  }, window.WC_OG || {});
  if (params.has("title")) og.title = params.get("title");
  if (params.has("cover")) og.cover = params.get("cover");

  const titleEl = document.getElementById("og-title");
  titleEl.textContent = og.title || "跟著走路貓，慢慢走進加密世界";
  if (titleEl.textContent.length > 34) titleEl.classList.add("is-long");

  let coverUrl = null;
  try {
    if (og.cover) {
      const u = new URL(og.cover, location.href);
      if (["http:", "https:", "file:"].includes(u.protocol)) coverUrl = u.href;
    }
  } catch (_) {}
  if (coverUrl) {
    const img = new Image();
    img.className = "cover";
    img.alt = "";
    img.onload = () => document.getElementById("og-brand").remove();
    img.onerror = () => img.remove();
    img.src = coverUrl;
    document.getElementById("og-side").appendChild(img);
  }
</script>
</body>
</html>
